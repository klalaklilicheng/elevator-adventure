<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>皇家电梯 · Royal Elevator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
body{display:flex;align-items:center;justify-content:center;touch-action:manipulation;background:#1a0a2e}

#game{position:relative;width:100vw;height:100vh;max-width:520px;background:linear-gradient(180deg,#ffecd2 0%,#fcb69f 50%,#ffecd2 100%);overflow:hidden}

/* === 积分 左上 === */
#score-box{position:absolute;top:env(safe-area-inset-top,14px);left:14px;z-index:60;background:rgba(255,255,255,.92);border-radius:20px;padding:8px 18px;box-shadow:0 4px 16px rgba(0,0,0,.1);display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;color:#e91e63}
#score-box .star{font-size:24px}

/* === 任务气泡 === */
#task-bubble{position:absolute;top:env(safe-area-inset-top,14px);left:50%;transform:translateX(-50%);z-index:55;background:#fff;border-radius:22px;padding:10px 22px;box-shadow:0 6px 24px rgba(0,0,0,.12);display:flex;align-items:center;gap:12px;min-width:200px;justify-content:center;opacity:0;transition:opacity .4s,transform .4s}
#task-bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
#task-bubble.pop{animation:bubblePop .5s ease-out}
@keyframes bubblePop{0%{transform:translateX(-50%) scale(.6)}60%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
.bubble-char{font-size:36px}
.bubble-arrow{font-size:20px;color:#aaa}
.bubble-target{background:linear-gradient(135deg,#ff6b9d,#c850c0);border-radius:14px;padding:6px 14px;color:#fff;font-weight:900;font-size:28px;line-height:1;display:flex;flex-direction:column;align-items:center}
.bubble-target small{font-size:10px;margin-top:2px;opacity:.9;letter-spacing:1px}

/* === 建筑 === */
#building{position:absolute;top:80px;bottom:200px;left:20px;right:20px;display:flex;border-radius:16px;overflow:visible}

/* 楼层 */
#floors-side{flex:1;display:flex;flex-direction:column-reverse;position:relative}
.floor-row{flex:1;border-bottom:2px solid rgba(139,69,19,.15);display:flex;align-items:center;padding:0 10px;position:relative}
.floor-row:last-child{border-bottom:3px solid rgba(139,69,19,.4)}
.fl-num{font-size:14px;font-weight:800;color:#8b4513;opacity:.6;width:22px}
.fl-waiting{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding-right:8px}
.waiting-char{font-size:clamp(28px,6vw,40px);opacity:0;transform:scale(.5);transition:all .4s ease-out}
.waiting-char.show{opacity:1;transform:scale(1);animation:charBounce 2s ease-in-out infinite}
@keyframes charBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* 电梯井道 === */
#shaft{width:clamp(90px,22vw,120px);background:linear-gradient(180deg,#4a2c2a,#2d1b18);border-radius:12px;position:relative;border:3px solid #8b4513;overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}

/* LED */
#led-display{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#111;border:2px solid #444;border-radius:6px;padding:3px 10px;z-index:5;display:flex;align-items:center;gap:4px}
#led-floor{font-family:"Courier New",monospace;font-size:22px;font-weight:900;color:#0f0;text-shadow:0 0 10px #0f0}
#led-dir{font-size:12px;color:#0f0;text-shadow:0 0 6px #0f0}

/* 轿厢 */
#cabin{position:absolute;left:6px;right:6px;height:calc((100% - 40px) / 5);bottom:4px;background:linear-gradient(180deg,#fff8e1,#ffe0b2);border:3px solid #ff8f00;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3),inset 0 -2px 8px rgba(0,0,0,.1);transition:bottom .9s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:center;overflow:hidden}
#cabin::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#ff8f00,#ffc107,#ff8f00);border-radius:7px 7px 0 0}

/* 门 */
.door{position:absolute;top:8px;bottom:4px;width:calc(50% - 6px);background:linear-gradient(180deg,#795548,#5d4037);border-radius:4px;transition:transform .6s cubic-bezier(.25,.8,.25,1);z-index:2}
.door.L{left:4px}
.door.R{right:4px}
#cabin.open .door.L{transform:translateX(-95%)}
#cabin.open .door.R{transform:translateX(95%)}

/* 门上的小窗 */
.door::after{content:'';position:absolute;top:20%;left:25%;width:50%;height:25%;background:rgba(255,255,255,.15);border-radius:4px}

/* 轿厢内乘客 */
#cabin-inside{z-index:1;font-size:clamp(24px,5vw,34px);display:flex;gap:2px}

/* 轿厢指示灯 */
#cabin-light{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#4caf50;box-shadow:0 0 6px #4caf50;z-index:3;transition:background .3s,box-shadow .3s}
#cabin-light.moving{background:#ff9800;box-shadow:0 0 8px #ff9800;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* === 控制面板 === */
#panel{position:absolute;bottom:env(safe-area-inset-bottom,10px);left:10px;right:10px;z-index:40;padding-bottom:6px}
#panel-bg{background:rgba(255,255,255,.95);border-radius:24px;padding:16px;box-shadow:0 -4px 24px rgba(0,0,0,.1)}

#floor-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.fbtn{aspect-ratio:1;border-radius:50%;border:3px solid #e0e0e0;background:#fff;font-size:clamp(18px,5vw,26px);font-weight:900;color:#333;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.fbtn:active{transform:scale(.9)}
.fbtn.lit{background:linear-gradient(135deg,#ff6b9d,#c850c0);color:#fff;border-color:#c850c0;box-shadow:0 0 20px rgba(200,80,192,.4)}
.fbtn.wrong{animation:shake .35s;border-color:#f44336;background:#fee}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fbtn small{font-size:8px;color:#999;font-weight:600;margin-top:1px}
.fbtn.lit small{color:rgba(255,255,255,.8)}

#door-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dbtn{padding:14px;border:none;border-radius:16px;font-size:18px;font-weight:800;color:#fff;cursor:pointer;transition:transform .1s;display:flex;flex-direction:column;align-items:center;gap:2px}
.dbtn:active{transform:scale(.94)}
.dbtn.open{background:linear-gradient(135deg,#4caf50,#2e7d32)}
.dbtn.close{background:linear-gradient(135deg,#f44336,#c62828)}
.dbtn small{font-size:11px;opacity:.85}

/* === 开始页 === */
#intro{position:absolute;inset:0;z-index:500;background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px;transition:opacity .6s}
#intro.hide{opacity:0;pointer-events:none}
#intro .chars{font-size:72px;margin-bottom:16px;animation:float 2.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#intro h1{font-size:clamp(30px,8vw,44px);margin-bottom:6px;text-shadow:0 3px 10px rgba(0,0,0,.2)}
#intro h2{font-size:clamp(16px,4vw,20px);opacity:.9;font-weight:400;margin-bottom:36px}
#go-btn{background:#fff;color:#764ba2;border:none;padding:18px 52px;border-radius:999px;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.2)}
#go-btn:active{transform:scale(.95)}

/* === 胜利页 === */
#victory{position:absolute;inset:0;z-index:600;display:none;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(135deg,#ff6a88,#ff99ac,#fcb69f,#ffecd2);text-align:center;padding:24px}
#victory.show{display:flex;animation:victoryIn .8s ease-out}
@keyframes victoryIn{0%{opacity:0;transform:scale(.3) rotate(-10deg)}50%{transform:scale(1.1) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
#victory .crown{font-size:100px;animation:crownBounce 1s ease-in-out infinite}
@keyframes crownBounce{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-15px) rotate(-5deg)}75%{transform:translateY(-15px) rotate(5deg)}}
#victory .v-title{font-size:clamp(36px,10vw,56px);font-weight:900;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.2);margin:16px 0 8px}
#victory .v-sub{font-size:clamp(18px,5vw,26px);color:rgba(255,255,255,.9);margin-bottom:24px}
#victory .v-stars{font-size:36px;margin-bottom:24px}
#victory .v-again{background:#fff;color:#e91e63;border:none;padding:16px 44px;border-radius:999px;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#victory .v-again:active{transform:scale(.95)}
.confetti{position:absolute;pointer-events:none;z-index:601;border-radius:3px}

/* === 音效按钮 === */
#sound-toggle{position:absolute;top:env(safe-area-inset-top,14px);right:14px;z-index:60;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.1)}
</style>
</head>
<body>
<div id="game">

<!-- 开始页 -->
<div id="intro">
  <div class="chars">👸🤴🛗</div>
  <h1>皇家电梯</h1>
  <h2>Royal Elevator</h2>
  <button id="go-btn">开始 · Start</button>
</div>

<!-- 积分 -->
<div id="score-box"><span class="star">⭐</span><span id="score-num">0</span></div>
<button id="sound-toggle">🔊</button>

<!-- 任务气泡 -->
<div id="task-bubble">
  <span class="bubble-char" id="b-char">👸</span>
  <span class="bubble-arrow">➜</span>
  <span class="bubble-target"><span id="b-floor">3</span><small id="b-en">THREE</small></span>
</div>

<!-- 建筑 -->
<div id="building">
  <div id="floors-side"></div>
  <div id="shaft">
    <div id="led-display"><span id="led-dir">■</span><span id="led-floor">1</span></div>
    <div id="cabin">
      <div id="cabin-light"></div>
      <div class="door L"></div>
      <div class="door R"></div>
      <div id="cabin-inside"></div>
    </div>
  </div>
</div>

<!-- 控制面板 -->
<div id="panel"><div id="panel-bg">
  <div id="floor-grid"></div>
  <div id="door-row">
    <button class="dbtn open" id="btn-open">开门<small>OPEN</small></button>
    <button class="dbtn close" id="btn-close">关门<small>CLOSE</small></button>
  </div>
</div></div>

<!-- 胜利页 -->
<div id="victory">
  <div class="crown">👑</div>
  <div class="v-title" id="v-title">太棒啦!</div>
  <div class="v-sub" id="v-sub">You are AMAZING!</div>
  <div class="v-stars" id="v-stars"></div>
  <button class="v-again" id="v-again">再玩一次 · Again</button>
</div>

</div>

<script>
'use strict';

const FLOORS = 5;
const NUM_EN = ['','ONE','TWO','THREE','FOUR','FIVE'];
const CHARS = ['👸','🤴','👸','🤴','👸','🤴'];
const WIN_SCORE = 5;

const PRAISE = [
  ['太棒了!','Great job!'],
  ['你真厉害!','Amazing!'],
  ['完美!','Perfect!'],
  ['好聪明!','So smart!'],
  ['超级棒!','Wonderful!'],
];

const $ = s => document.querySelector(s);

/* === 状态 === */
const st = {
  floor: 1,
  doorOpen: false,
  busy: false,
  phase: 'pickup', // pickup | dropoff
  task: null,       // {char, pickup, drop}
  score: 0,
};

/* === 音频 === */
let ac = null;
function ensureAC(){
  if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(ac&&ac.state==='suspended')ac.resume();
}
function playTone(freq,dur=.12,type='sine',vol=.12){
  if(!ac)return;
  try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.stop(ac.currentTime+dur)}catch(e){}
}
function ding(){playTone(880,.12);setTimeout(()=>playTone(1100,.1),100);setTimeout(()=>playTone(1320,.15),200)}
function boop(){playTone(520,.06)}
function buzz(){playTone(160,.2,'sawtooth',.08)}
function cuteMelody(){
  const notes=[523,587,659,784,880];
  notes.forEach((n,i)=>setTimeout(()=>playTone(n,.12,'sine',.1),i*120));
}
function victoryFanfare(){
  const notes=[523,523,523,659,784,784,659,784,1047];
  const durs=[.1,.1,.2,.15,.1,.1,.15,.15,.3];
  let t=0;
  notes.forEach((n,i)=>{setTimeout(()=>playTone(n,durs[i],'sine',.13),t*1000);t+=durs[i]+.05});
}

/* === 语音 === */
const synth=window.speechSynthesis;
let zhV=null,enV=null;
function pickV(){if(!synth)return;const v=synth.getVoices();zhV=v.find(x=>/zh|cmn/i.test(x.lang))||null;enV=v.find(x=>/en[-_]?(US|GB)/i.test(x.lang))||v.find(x=>x.lang&&x.lang.startsWith('en'))||null}
if(synth){pickV();synth.onvoiceschanged=pickV}
const sq=[];let spk=false;
function enq(text,lang){sq.push({text,lang});pump()}
function pump(){if(spk||!sq.length||!synth)return;const{text,lang}=sq.shift();spk=true;try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang.startsWith('zh')?1:.8;u.pitch=1.2;if(lang.startsWith('zh')&&zhV)u.voice=zhV;if(lang.startsWith('en')&&enV)u.voice=enV;u.onend=u.onerror=()=>{spk=false;setTimeout(pump,80)};synth.speak(u)}catch(e){spk=false;setTimeout(pump,50)}}
function clearSp(){sq.length=0;if(synth)try{synth.cancel()}catch(e){}spk=false}
function say(zh,en){if(zh)enq(zh,'zh-CN');if(en)enq(en,'en-US')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearSp()});

/* === 构建楼层 === */
const floorsSide=$('#floors-side');
for(let f=1;f<=FLOORS;f++){
  const row=document.createElement('div');
  row.className='floor-row';row.dataset.floor=f;
  row.innerHTML=`<span class="fl-num">${f}F</span><div class="fl-waiting" id="fw-${f}"></div>`;
  floorsSide.appendChild(row);
}

/* === 楼层按钮 === */
const grid=$('#floor-grid');
const fbtns=[];
for(let f=1;f<=FLOORS;f++){
  const b=document.createElement('button');
  b.className='fbtn';b.dataset.floor=f;
  b.innerHTML=`${f}<small>${NUM_EN[f]}</small>`;
  b.addEventListener('click',()=>onFloorBtn(f,b));
  grid.appendChild(b);
  fbtns.push(b);
}

$('#btn-open').addEventListener('click',onOpen);
$('#btn-close').addEventListener('click',onClose);
$('#sound-toggle').addEventListener('click',()=>{ensureAC();repeatHint()});

/* === 轿厢定位 === */
function placeCabin(floor,anim=true){
  const cabin=$('#cabin');
  const shaftH=$('#shaft').clientHeight-40;
  const floorH=shaftH/FLOORS;
  const bottom=4+(floor-1)*floorH;
  if(!anim){cabin.style.transition='none';cabin.style.bottom=bottom+'px';void cabin.offsetHeight;cabin.style.transition=''}
  else{cabin.style.bottom=bottom+'px'}
}

function updateLED(floor,dir){
  $('#led-floor').textContent=floor;
  $('#led-dir').textContent=dir==='up'?'▲':dir==='down'?'▼':'■';
}

/* === 出题 === */
function newRound(){
  st.busy=false;
  st.phase='pickup';
  st.doorOpen=false;
  $('#cabin').classList.remove('open');
  $('#cabin-inside').textContent='';
  fbtns.forEach(b=>b.classList.remove('lit','wrong'));

  // 清旧
  document.querySelectorAll('.waiting-char').forEach(el=>el.remove());

  let pickup,drop;
  do{
    pickup=1+Math.floor(Math.random()*FLOORS);
    drop=1+Math.floor(Math.random()*FLOORS);
  }while(pickup===drop||pickup===st.floor);

  const char=CHARS[Math.floor(Math.random()*CHARS.length)];
  st.task={char,pickup,drop};

  // 放角色到楼层
  const container=$(`#fw-${pickup}`);
  const el=document.createElement('span');
  el.className='waiting-char';el.id='active-char';el.textContent=char;
  container.appendChild(el);
  setTimeout(()=>el.classList.add('show'),60);

  // 更新气泡
  $('#b-char').textContent=char;
  $('#b-floor').textContent=pickup;
  $('#b-en').textContent=NUM_EN[pickup];
  const bubble=$('#task-bubble');
  bubble.classList.add('show');
  bubble.classList.remove('pop');
  void bubble.offsetWidth;
  bubble.classList.add('pop');

  // 语音
  setTimeout(()=>{
    const who=char==='👸'?'公主':'王子';
    const whoEn=char==='👸'?'princess':'prince';
    say(`${who}在${pickup}楼，去接${who === '公主' ? '她' : '他'}`,`The ${whoEn} is on floor ${NUM_EN[pickup]}, pick ${whoEn==='princess'?'her':'him'} up`);
  },400);
}

/* === 楼层按钮点击 === */
function onFloorBtn(floor,btn){
  ensureAC();
  if(st.busy)return;
  boop();

  // 说出数字
  say(String(floor),`Floor ${NUM_EN[floor]}`);

  if(st.doorOpen){
    btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),350);
    say('先关门哦','Close the door first');return;
  }

  const target=st.phase==='pickup'?st.task.pickup:st.task.drop;

  if(floor!==target){
    btn.classList.add('wrong');buzz();
    setTimeout(()=>btn.classList.remove('wrong'),350);
    setTimeout(()=>say('再试一次','Try again'),300);
    return;
  }

  fbtns.forEach(b=>b.classList.remove('lit'));
  btn.classList.add('lit');
  moveTo(floor);
}

/* === 移动 === */
function moveTo(floor){
  if(floor===st.floor){afterArrive();return}
  st.busy=true;
  const dir=floor>st.floor?'up':'down';
  const light=$('#cabin-light');
  light.classList.add('moving');
  updateLED(st.floor,dir);
  say(dir==='up'?'上升':'下降',dir==='up'?'Going up':'Going down');

  placeCabin(floor);

  const dist=Math.abs(floor-st.floor);
  const duration=500+dist*180;
  let f=st.floor;const step=dir==='up'?1:-1;
  const iv=setInterval(()=>{f+=step;updateLED(f,dir);playTone(350+f*60,.05)},duration/dist);

  setTimeout(()=>{
    clearInterval(iv);
    st.floor=floor;st.busy=false;
    light.classList.remove('moving');
    fbtns.forEach(b=>b.classList.remove('lit'));
    updateLED(floor,'');
    ding();
    afterArrive();
  },duration);
}

function afterArrive(){
  setTimeout(()=>say('到了，按开门','Arrived! Press OPEN'),250);
}

/* === 开门 === */
function onOpen(){
  ensureAC();
  if(st.busy)return;
  if(st.doorOpen){say('门已经开着啦','Door is already open');return}

  const target=st.phase==='pickup'?st.task.pickup:st.task.drop;
  if(st.floor!==target){
    buzz();
    say(`要先去${target}楼哦`,`Go to floor ${NUM_EN[target]} first`);
    return;
  }

  st.busy=true;st.doorOpen=true;
  $('#cabin').classList.add('open');
  boop();say('开门','Open');

  if(st.phase==='pickup'){
    setTimeout(()=>{
      const el=$('#active-char');
      if(el){el.style.transition='all .4s';el.style.opacity='0';el.style.transform='scale(.3)';setTimeout(()=>el.remove(),400)}
      $('#cabin-inside').textContent=st.task.char;
      st.phase='dropoff';
      // 更新气泡
      $('#b-floor').textContent=st.task.drop;
      $('#b-en').textContent=NUM_EN[st.task.drop];
      const bubble=$('#task-bubble');bubble.classList.remove('pop');void bubble.offsetWidth;bubble.classList.add('pop');
      st.busy=false;
      cuteMelody();
      const who=st.task.char==='👸'?'公主':'王子';
      const whoEn=st.task.char==='👸'?'princess':'prince';
      setTimeout(()=>say(`送${who}去${st.task.drop}楼`,`Take the ${whoEn} to floor ${NUM_EN[st.task.drop]}`),500);
    },650);
  } else {
    // 送达!
    setTimeout(()=>{
      $('#cabin-inside').style.transition='opacity .3s';
      $('#cabin-inside').style.opacity='0';
      setTimeout(()=>{
        $('#cabin-inside').textContent='';
        $('#cabin-inside').style.opacity='1';
        $('#cabin-inside').style.transition='';
        st.score++;
        $('#score-num').textContent=st.score;
        st.busy=false;

        if(st.score>=WIN_SCORE){
          showVictory();
        }else{
          showPraise();
          setTimeout(newRound,2000);
        }
      },300);
    },600);
  }
}

/* === 关门 === */
function onClose(){
  ensureAC();
  if(st.busy)return;
  if(!st.doorOpen){say('门已经关着','Door is already closed');return}
  st.doorOpen=false;
  $('#cabin').classList.remove('open');
  boop();say('关门','Close');
}

/* === 表扬 === */
function showPraise(){
  const [zh,en]=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  say(zh,en);
  cuteMelody();
  miniConfetti();
}

function miniConfetti(){
  const colors=['#ff6b9d','#ffd166','#06d6a0','#c850c0','#118ab2','#ff6b35'];
  for(let i=0;i<20;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.background=colors[i%colors.length];
    c.style.width=Math.random()*8+6+'px';
    c.style.height=Math.random()*10+8+'px';
    c.style.left=Math.random()*100+'%';c.style.top='-10px';
    c.style.position='absolute';c.style.zIndex='100';
    const dx=(Math.random()-.5)*160;
    c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,60vh) rotate(${500+Math.random()*400}deg)`,opacity:0}],{duration:1400+Math.random()*600,easing:'ease-out'});
    $('#game').appendChild(c);
    setTimeout(()=>c.remove(),2100);
  }
}

/* === 胜利页 === */
function showVictory(){
  victoryFanfare();
  say('恭喜你，全部送达！你是最棒的小司机！','Congratulations! You are the best elevator driver!');

  const stars='⭐'.repeat(st.score);
  $('#v-stars').textContent=stars;

  const titles=['太棒啦!','你是冠军!','超级厉害!','完美通关!'];
  const subs=['You are AMAZING!','Champion!','SUPER STAR!','PERFECT!'];
  const idx=Math.floor(Math.random()*titles.length);
  $('#v-title').textContent=titles[idx];
  $('#v-sub').textContent=subs[idx];

  $('#victory').classList.add('show');
  massConfetti();
}

function massConfetti(){
  const colors=['#ff6b9d','#ffd166','#06d6a0','#c850c0','#118ab2','#ff6b35','#a855f7','#ec4899'];
  for(let wave=0;wave<3;wave++){
    setTimeout(()=>{
      for(let i=0;i<40;i++){
        const c=document.createElement('div');c.className='confetti';
        c.style.background=colors[i%colors.length];
        c.style.width=Math.random()*10+8+'px';
        c.style.height=Math.random()*14+8+'px';
        c.style.left=Math.random()*100+'%';c.style.top='-20px';
        c.style.position='absolute';c.style.zIndex='602';
        const dx=(Math.random()-.5)*300;
        const dur=2000+Math.random()*1500;
        c.animate([
          {transform:'translate(0,0) rotate(0)',opacity:1},
          {transform:`translate(${dx}px,110vh) rotate(${800+Math.random()*600}deg)`,opacity:.7}
        ],{duration:dur,easing:'cubic-bezier(.15,.8,.3,1)'});
        $('#game').appendChild(c);
        setTimeout(()=>c.remove(),dur+50);
      }
    },wave*600);
  }
}

$('#v-again').addEventListener('click',()=>{
  $('#victory').classList.remove('show');
  st.score=0;
  $('#score-num').textContent='0';
  ensureAC();
  say('再来一次','Let\'s go again');
  setTimeout(newRound,800);
});

/* === 提示 === */
function repeatHint(){
  if(!st.task)return;
  if(st.phase==='pickup'){
    const who=st.task.char==='👸'?'公主':'王子';
    say(`去${st.task.pickup}楼接${who}`,`Go to floor ${NUM_EN[st.task.pickup]}`);
  }else{
    say(`送到${st.task.drop}楼`,`Go to floor ${NUM_EN[st.task.drop]}`);
  }
}

/* === 启动 === */
$('#go-btn').addEventListener('click',()=>{
  $('#intro').classList.add('hide');
  ensureAC();
  say('欢迎来到皇家电梯','Welcome to Royal Elevator');
  cuteMelody();
  placeCabin(1,false);
  updateLED(1,'');
  setTimeout(newRound,2200);
});

// 初始化
placeCabin(1,false);

// resize 时重新定位轿厢
window.addEventListener('resize',()=>{placeCabin(st.floor,false)});
</script>
</body>
</html>
