<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>皇家电梯 · Royal Elevator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
body{display:flex;align-items:center;justify-content:center;touch-action:manipulation;background:#1a0a2e}

#game{
  position:relative;width:100vw;height:100vh;max-width:520px;
  background:linear-gradient(180deg,#ffecd2 0%,#fcb69f 50%,#ffecd2 100%);
  overflow:hidden;display:flex;flex-direction:column;
}

/* === Top bar === */
#top-bar{
  position:relative;z-index:10;display:flex;align-items:center;
  padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top,6px));
  gap:6px;min-height:44px;flex-shrink:0;
}
#score-box{
  background:rgba(255,255,255,.92);border-radius:20px;padding:5px 12px;
  box-shadow:0 4px 16px rgba(0,0,0,.1);display:flex;align-items:center;gap:5px;
  font-size:17px;font-weight:800;color:#e91e63;flex-shrink:0;transition:transform .3s;
}
#score-box.pop{animation:scorePop .4s ease-out}
@keyframes scorePop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
#score-box .star{font-size:18px}

#task-bar{
  flex:1;display:flex;gap:5px;align-items:center;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;justify-content:center;
}
#task-bar::-webkit-scrollbar{display:none}
.task-card{
  background:#fff;border-radius:12px;padding:4px 8px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);display:flex;align-items:center;gap:4px;
  min-width:max-content;transition:all .3s;border:2px solid transparent;
}
.task-card.active{border-color:#c850c0;background:linear-gradient(135deg,#fff0f6,#fff);box-shadow:0 3px 16px rgba(200,80,192,.25)}
.tc-char{position:relative}
.tc-info{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tc-from,.tc-to{font-size:10px;font-weight:800;color:#333}
.tc-arrow{font-size:7px;color:#aaa}
.tc-to{color:#c850c0}

.char-avatar{
  display:inline-flex;align-items:center;justify-content:center;
  position:relative;border-radius:50%;line-height:1;
}
.char-avatar .acc{
  position:absolute;bottom:-1px;right:-3px;line-height:1;
  background:#fff;border-radius:50%;padding:1px;
  box-shadow:0 1px 2px rgba(0,0,0,.2);
}

#sound-toggle{
  background:rgba(255,255,255,.9);border:none;border-radius:50%;
  width:34px;height:34px;font-size:16px;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.1);flex-shrink:0;
}

/* === Building (flex:1, never overlaps panel) === */
#building{
  flex:1;display:flex;margin:0 10px;border-radius:16px;overflow:visible;min-height:0;
}
#floors-side{flex:1;display:flex;flex-direction:column-reverse;position:relative}
.floor-row{
  flex:1;border-bottom:1.5px solid rgba(139,69,19,.12);
  display:flex;align-items:center;padding:0 4px;position:relative;
}
.floor-row:last-child{border-bottom:2px solid rgba(139,69,19,.3)}
.fl-num{font-size:10px;font-weight:800;color:#8b4513;opacity:.6;width:16px;text-align:center;flex-shrink:0}
.fl-waiting{
  flex:1;display:flex;align-items:center;justify-content:flex-end;
  gap:2px;padding-right:3px;flex-wrap:nowrap;overflow:hidden;
}
.waiting-char{
  opacity:0;transform:scale(.5);transition:all .4s ease-out;position:relative;display:inline-flex;align-items:center;
}
.waiting-char.show{opacity:1;transform:scale(1);animation:charBounce 2s ease-in-out infinite}
@keyframes charBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.waiting-dest{
  position:absolute;bottom:-2px;right:-4px;font-size:7px;
  background:#c850c0;color:#fff;border-radius:6px;padding:0 3px;font-weight:800;line-height:1.4;
}

/* === Shaft === */
#shaft{
  width:clamp(58px,15vw,88px);background:linear-gradient(180deg,#4a2c2a,#2d1b18);
  border-radius:10px;position:relative;border:3px solid #8b4513;
  overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.5);
}
#led-display{
  position:absolute;top:3px;left:50%;transform:translateX(-50%);
  background:#111;border:2px solid #444;border-radius:5px;
  padding:1px 7px;z-index:5;display:flex;align-items:center;gap:3px;
}
#led-floor{font-family:"Courier New",monospace;font-size:15px;font-weight:900;color:#0f0;text-shadow:0 0 10px #0f0}
#led-dir{font-size:9px;color:#0f0;text-shadow:0 0 6px #0f0}

#cabin{
  position:absolute;left:4px;right:4px;height:calc((100% - 28px)/10);bottom:3px;
  background:linear-gradient(180deg,#fff8e1,#ffe0b2);border:2.5px solid #ff8f00;
  border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.3),inset 0 -2px 6px rgba(0,0,0,.1);
  transition:bottom .9s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
#cabin::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ff8f00,#ffc107,#ff8f00);border-radius:6px 6px 0 0}

.door{
  position:absolute;top:6px;bottom:3px;width:calc(50% - 4px);
  background:linear-gradient(180deg,#795548,#5d4037);
  border-radius:3px;transition:transform .6s cubic-bezier(.25,.8,.25,1);z-index:2;
}
.door.L{left:3px}.door.R{right:3px}
#cabin.open .door.L{transform:translateX(-95%)}
#cabin.open .door.R{transform:translateX(95%)}
.door::after{content:'';position:absolute;top:18%;left:22%;width:56%;height:22%;background:rgba(255,255,255,.15);border-radius:3px}

#cabin-inside{z-index:1;font-size:clamp(12px,2.5vw,16px);display:flex;gap:1px;flex-wrap:wrap;justify-content:center;max-width:90%}
#cabin-light{
  position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:#4caf50;
  box-shadow:0 0 4px #4caf50;z-index:3;transition:background .3s,box-shadow .3s;
}
#cabin-light.moving{background:#ff9800;box-shadow:0 0 6px #ff9800;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* === Control panel (flex-shrink:0, stays at bottom) === */
#panel{position:relative;z-index:40;padding:4px 8px;padding-bottom:max(4px,env(safe-area-inset-bottom,4px));flex-shrink:0}
#panel-bg{background:rgba(255,255,255,.95);border-radius:18px;padding:8px 10px;box-shadow:0 -4px 24px rgba(0,0,0,.1)}

#floor-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:6px}
.fbtn{
  aspect-ratio:1;border-radius:50%;border:2.5px solid #e0e0e0;background:#fff;
  font-size:clamp(13px,3.5vw,18px);font-weight:900;color:#333;cursor:pointer;
  transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.fbtn:active{transform:scale(.9)}
.fbtn.lit{background:linear-gradient(135deg,#ff6b9d,#c850c0);color:#fff;border-color:#c850c0;box-shadow:0 0 16px rgba(200,80,192,.4)}
.fbtn.wrong{animation:shake .35s;border-color:#f44336;background:#fee}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fbtn small{font-size:6px;color:#999;font-weight:600;margin-top:0}
.fbtn.lit small{color:rgba(255,255,255,.8)}
.fbtn.has-passenger{border-color:#ff6b9d;box-shadow:0 0 8px rgba(255,107,157,.3)}

#door-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dbtn{
  padding:8px;border:none;border-radius:14px;font-size:14px;font-weight:800;
  color:#fff;cursor:pointer;transition:transform .1s;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.dbtn:active{transform:scale(.94)}
.dbtn.open{background:linear-gradient(135deg,#4caf50,#2e7d32)}
.dbtn.close{background:linear-gradient(135deg,#f44336,#c62828)}
.dbtn small{font-size:9px;opacity:.85}

/* === Intro === */
#intro{
  position:absolute;inset:0;z-index:500;
  background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;text-align:center;padding:24px;transition:opacity .6s;
}
#intro.hide{opacity:0;pointer-events:none}
#intro .chars{font-size:72px;margin-bottom:16px;animation:float 2.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#intro h1{font-size:clamp(30px,8vw,44px);margin-bottom:6px;text-shadow:0 3px 10px rgba(0,0,0,.2)}
#intro h2{font-size:clamp(16px,4vw,20px);opacity:.9;font-weight:400;margin-bottom:36px}
#go-btn{background:#fff;color:#764ba2;border:none;padding:18px 52px;border-radius:999px;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.2)}
#go-btn:active{transform:scale(.95)}

/* === Victory === */
#victory{
  position:absolute;inset:0;z-index:600;display:none;
  align-items:center;justify-content:center;flex-direction:column;
  background:linear-gradient(135deg,#0f0528,#1a0a3e,#0f0528);
  text-align:center;padding:24px;overflow:hidden;
}
#victory.show{display:flex;animation:victoryIn .8s ease-out}
@keyframes victoryIn{0%{opacity:0;transform:scale(.3) rotate(-10deg)}50%{transform:scale(1.1) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
#victory .crown{font-size:80px;animation:crownBounce 1s ease-in-out infinite}
@keyframes crownBounce{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-15px) rotate(-5deg)}75%{transform:translateY(-15px) rotate(5deg)}}
#victory .v-title{font-size:clamp(32px,9vw,52px);font-weight:900;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.3);margin:10px 0 4px}
#victory .v-sub{font-size:clamp(16px,4.5vw,24px);color:rgba(255,255,255,.85);margin-bottom:16px}

#star-collect{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:16px;min-height:50px}
.collected-star{font-size:32px;opacity:0;transform:scale(0) rotate(-180deg);transition:all .5s cubic-bezier(.34,1.56,.64,1)}
.collected-star.visible{opacity:1;transform:scale(1) rotate(0)}

#total-stars-box{
  background:rgba(255,255,255,.12);border-radius:14px;padding:8px 20px;
  margin-bottom:16px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);
}
#total-stars-box .label{font-size:13px;color:rgba(255,255,255,.65);margin-bottom:2px}
#total-stars-box .count{font-size:26px;font-weight:900;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.5)}

#victory .v-again{
  background:#fff;color:#e91e63;border:none;padding:14px 40px;
  border-radius:999px;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3);
}
#victory .v-again:active{transform:scale(.95)}

.confetti{position:absolute;pointer-events:none;border-radius:3px}
.fw-particle{position:absolute;pointer-events:none;border-radius:50%}
.fw-trail{position:absolute;pointer-events:none;border-radius:2px}
</style>
</head>
<body>
<div id="game">

<div id="intro">
  <div class="chars">👸🏻🤴🏼🛗</div>
  <h1>皇家电梯</h1>
  <h2>Royal Elevator · 10层</h2>
  <button id="go-btn">开始 · Start</button>
</div>

<div id="top-bar">
  <div id="score-box"><span class="star">⭐</span><span id="score-num">0</span></div>
  <div id="task-bar"></div>
  <button id="sound-toggle">🔊</button>
</div>

<div id="building">
  <div id="floors-side"></div>
  <div id="shaft">
    <div id="led-display"><span id="led-dir">■</span><span id="led-floor">1</span></div>
    <div id="cabin">
      <div id="cabin-light"></div>
      <div class="door L"></div>
      <div class="door R"></div>
      <div id="cabin-inside"></div>
    </div>
  </div>
</div>

<div id="panel"><div id="panel-bg">
  <div id="floor-grid"></div>
  <div id="door-row">
    <button class="dbtn open" id="btn-open">开门<small>OPEN</small></button>
    <button class="dbtn close" id="btn-close">关门<small>CLOSE</small></button>
  </div>
</div></div>

<div id="victory">
  <div class="crown">👑</div>
  <div class="v-title" id="v-title">太棒啦!</div>
  <div class="v-sub" id="v-sub">You are AMAZING!</div>
  <div id="star-collect"></div>
  <div id="total-stars-box">
    <div class="label">⭐ 累计星星 Total Stars</div>
    <div class="count" id="total-stars-count">0</div>
  </div>
  <button class="v-again" id="v-again">再玩一次 · Again</button>
</div>

</div>

<script>
'use strict';

const FLOORS=10;
const NUM_EN=['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN'];
const WIN_SCORE=8;
const MAX_QUEUE=3;

const CHARACTERS=[
  {emoji:'👸🏻',accessory:'🌸',name:'花仙公主',nameEn:'Flower Princess',color:'#ff69b4',type:'princess'},
  {emoji:'👸🏼',accessory:'⭐',name:'星星公主',nameEn:'Star Princess',color:'#9370db',type:'princess'},
  {emoji:'👸🏽',accessory:'🦋',name:'蝴蝶公主',nameEn:'Butterfly Princess',color:'#4169e1',type:'princess'},
  {emoji:'👸🏾',accessory:'🌙',name:'月亮公主',nameEn:'Moon Princess',color:'#daa520',type:'princess'},
  {emoji:'🤴🏻',accessory:'⚔️',name:'勇士王子',nameEn:'Brave Prince',color:'#dc143c',type:'prince'},
  {emoji:'🤴🏼',accessory:'🛡️',name:'盾牌王子',nameEn:'Shield Prince',color:'#228b22',type:'prince'},
  {emoji:'🤴🏽',accessory:'🎵',name:'音乐王子',nameEn:'Music Prince',color:'#1e90ff',type:'prince'},
  {emoji:'🤴🏾',accessory:'🦁',name:'狮子王子',nameEn:'Lion Prince',color:'#ff8c00',type:'prince'},
];

const PRAISE=[
  ['太棒了!','Great job!'],
  ['你真厉害!','Amazing!'],
  ['完美!','Perfect!'],
  ['好聪明!','So smart!'],
  ['超级棒!','Wonderful!'],
];

const $=s=>document.querySelector(s);
let totalStars=parseInt(localStorage.getItem('elevator_total_stars')||'0');

const st={floor:1,doorOpen:false,busy:false,tasks:[],passengers:[],score:0,taskId:0,charIndex:0};

/* === Audio === */
let ac=null;
function ensureAC(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(ac&&ac.state==='suspended')ac.resume()}
function playTone(freq,dur=.12,type='sine',vol=.12){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.stop(ac.currentTime+dur)}catch(e){}}
function ding(){playTone(880,.12);setTimeout(()=>playTone(1100,.1),100);setTimeout(()=>playTone(1320,.15),200)}
function boop(){playTone(520,.06)}
function buzz(){playTone(160,.2,'sawtooth',.08)}
function cuteMelody(){[523,587,659,784,880].forEach((n,i)=>setTimeout(()=>playTone(n,.12,'sine',.1),i*120))}
function victoryFanfare(){const n=[523,523,523,659,784,784,659,784,1047],d=[.1,.1,.2,.15,.1,.1,.15,.15,.3];let t=0;n.forEach((f,i)=>{setTimeout(()=>playTone(f,d[i],'sine',.13),t*1000);t+=d[i]+.05})}
function pickupChime(){playTone(659,.1);setTimeout(()=>playTone(784,.1),100);setTimeout(()=>playTone(1047,.15),200)}
function starChime(i){playTone(523+i*80,.15,'sine',.1)}

/* === Speech (fixed: natural pitch, better voice selection) === */
const synth=window.speechSynthesis;
let zhV=null,enV=null;
function pickV(){
  if(!synth)return;
  const v=synth.getVoices();
  zhV=v.find(x=>/zh[-_]CN/i.test(x.lang)&&/Ting-Ting|Lili|Xiaoxiao|Yunyang/i.test(x.name))
    ||v.find(x=>/zh[-_]CN/i.test(x.lang))
    ||v.find(x=>/zh|cmn/i.test(x.lang))||null;
  enV=v.find(x=>/en[-_]US/i.test(x.lang)&&/Samantha|Alex|Nicky|Allison/i.test(x.name))
    ||v.find(x=>/en[-_](US|GB)/i.test(x.lang))
    ||v.find(x=>x.lang&&x.lang.startsWith('en'))||null;
}
if(synth){pickV();synth.onvoiceschanged=pickV}

const sq=[];let spk=false;
function enq(text,lang){sq.push({text,lang});pump()}
function pump(){
  if(spk||!sq.length||!synth)return;
  const{text,lang}=sq.shift();spk=true;
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang;
    u.rate=lang.startsWith('zh')?0.9:0.85;
    u.pitch=1.0;
    u.volume=1.0;
    if(lang.startsWith('zh')&&zhV)u.voice=zhV;
    if(lang.startsWith('en')&&enV)u.voice=enV;
    u.onend=u.onerror=()=>{spk=false;setTimeout(pump,120)};
    synth.speak(u);
  }catch(e){spk=false;setTimeout(pump,50)}
}
function clearSp(){sq.length=0;if(synth)try{synth.cancel()}catch(e){}spk=false}
function say(zh,en){if(zh)enq(zh,'zh-CN');if(en)enq(en,'en-US')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearSp()});

/* === Build floors === */
const floorsSide=$('#floors-side');
for(let f=1;f<=FLOORS;f++){
  const row=document.createElement('div');
  row.className='floor-row';row.dataset.floor=f;
  row.innerHTML=`<span class="fl-num">${f}F</span><div class="fl-waiting" id="fw-${f}"></div>`;
  floorsSide.appendChild(row);
}

/* === Floor buttons === */
const grid=$('#floor-grid'),fbtns=[];
for(let f=6;f<=10;f++){const b=document.createElement('button');b.className='fbtn';b.dataset.floor=f;b.innerHTML=`${f}<small>${NUM_EN[f]}</small>`;b.addEventListener('click',()=>onFloorBtn(f,b));grid.appendChild(b);fbtns[f]=b}
for(let f=1;f<=5;f++){const b=document.createElement('button');b.className='fbtn';b.dataset.floor=f;b.innerHTML=`${f}<small>${NUM_EN[f]}</small>`;b.addEventListener('click',()=>onFloorBtn(f,b));grid.appendChild(b);fbtns[f]=b}

$('#btn-open').addEventListener('click',onOpen);
$('#btn-close').addEventListener('click',onClose);
$('#sound-toggle').addEventListener('click',()=>{ensureAC();repeatHint()});

/* === Character rendering === */
function renderChar(ch,size){
  size=size||18;
  const as=Math.max(7,Math.floor(size*.38));
  return `<span class="char-avatar" style="font-size:${size}px;width:${size+4}px;height:${size+4}px;background:${ch.color}20;border:1.5px solid ${ch.color}55;">${ch.emoji}<span class="acc" style="font-size:${as}px">${ch.accessory}</span></span>`;
}

/* === Cabin position === */
function placeCabin(floor,anim=true){
  const cabin=$('#cabin'),shaftH=$('#shaft').clientHeight-28,floorH=shaftH/FLOORS,bottom=3+(floor-1)*floorH;
  if(!anim){cabin.style.transition='none';cabin.style.bottom=bottom+'px';void cabin.offsetHeight;cabin.style.transition=''}
  else cabin.style.bottom=bottom+'px';
}
function updateLED(floor,dir){$('#led-floor').textContent=floor;$('#led-dir').textContent=dir==='up'?'▲':dir==='down'?'▼':'■'}

/* === Task bar === */
function renderTaskBar(){
  const bar=$('#task-bar');bar.innerHTML='';
  const active=getActiveTask();
  st.tasks.forEach(t=>{
    if(t.done)return;
    const card=document.createElement('div');card.className='task-card';
    if(active&&t.id===active.id)card.classList.add('active');
    const from=t.pickedUp?'🛗':t.pickup;
    card.innerHTML=`<span class="tc-char">${renderChar(t.ch,18)}</span><span class="tc-info"><span class="tc-from">${from}F</span><span class="tc-arrow">▼</span><span class="tc-to">${t.drop}F</span></span>`;
    bar.appendChild(card);
  });
  for(let f=1;f<=FLOORS;f++)if(fbtns[f])fbtns[f].classList.remove('has-passenger');
  st.tasks.forEach(t=>{if(!t.pickedUp&&!t.done&&fbtns[t.pickup])fbtns[t.pickup].classList.add('has-passenger')});
}
function getActiveTask(){
  if(st.passengers.length>0)return st.tasks.find(t=>!t.done&&t.pickedUp);
  return st.tasks.find(t=>!t.done&&!t.pickedUp);
}

/* === Waiting characters on floors === */
function renderWaiting(){
  document.querySelectorAll('.waiting-char').forEach(el=>el.remove());
  st.tasks.forEach(t=>{
    if(t.pickedUp||t.done)return;
    const c=$(`#fw-${t.pickup}`);if(!c)return;
    const el=document.createElement('span');el.className='waiting-char';el.dataset.taskId=t.id;
    const sz=Math.max(13,Math.min(20,Math.floor(c.clientHeight*.65)));
    el.innerHTML=`${renderChar(t.ch,sz)}<span class="waiting-dest">${t.drop}</span>`;
    c.appendChild(el);setTimeout(()=>el.classList.add('show'),60);
  });
}

/* === Spawn task === */
function spawnTask(){
  if(st.tasks.filter(t=>!t.done).length>=MAX_QUEUE)return null;
  let pickup,drop;
  const used=st.tasks.filter(t=>!t.done&&!t.pickedUp).map(t=>t.pickup);
  let att=0;
  do{pickup=1+Math.floor(Math.random()*FLOORS);drop=1+Math.floor(Math.random()*FLOORS);att++}while((pickup===drop||used.includes(pickup))&&att<50);
  if(pickup===drop)drop=pickup===FLOORS?pickup-1:pickup+1;
  const ch=CHARACTERS[st.charIndex%CHARACTERS.length];st.charIndex++;
  const task={id:++st.taskId,ch,pickup,drop,pickedUp:false,done:false};
  st.tasks.push(task);renderWaiting();renderTaskBar();return task;
}

function startGame(){
  st.tasks=[];st.passengers=[];st.taskId=0;st.charIndex=0;st.busy=false;st.doorOpen=false;
  $('#cabin').classList.remove('open');$('#cabin-inside').textContent='';
  fbtns.forEach((b,i)=>{if(b)b.classList.remove('lit','wrong','has-passenger')});
  document.querySelectorAll('.waiting-char').forEach(el=>el.remove());
  const t1=spawnTask();
  setTimeout(()=>{
    spawnTask();renderTaskBar();
    if(t1)say(`${t1.ch.name}在${t1.pickup}楼等电梯`,`${t1.ch.nameEn} is on floor ${NUM_EN[t1.pickup]}`);
  },800);
}

let spawnTimer=null;
function startSpawnTimer(){
  if(spawnTimer)clearInterval(spawnTimer);
  spawnTimer=setInterval(()=>{
    if(st.busy)return;
    if(st.tasks.filter(t=>!t.done).length<MAX_QUEUE){
      const t=spawnTask();
      if(t){pickupChime();say(`${t.ch.name}在${t.pickup}楼等电梯`,`${t.ch.nameEn} on floor ${NUM_EN[t.pickup]}`);}
    }
  },8000);
}

/* === Floor button click === */
function onFloorBtn(floor,btn){
  ensureAC();if(st.busy)return;boop();
  say(String(floor),`Floor ${NUM_EN[floor]}`);
  if(st.doorOpen){btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),350);say('先关门哦','Close the door first');return}
  const hasW=st.tasks.some(t=>!t.done&&!t.pickedUp&&t.pickup===floor);
  const hasD=st.passengers.some(p=>p.drop===floor);
  if(!hasW&&!hasD&&st.passengers.length===0){
    const nt=st.tasks.find(t=>!t.done&&!t.pickedUp);
    if(nt&&floor!==nt.pickup){btn.classList.add('wrong');buzz();setTimeout(()=>btn.classList.remove('wrong'),350);say(`去${nt.pickup}楼接${nt.ch.name}`,`Go to floor ${NUM_EN[nt.pickup]}`);return}
  }
  fbtns.forEach((b,i)=>{if(b)b.classList.remove('lit')});btn.classList.add('lit');moveTo(floor);
}

function moveTo(floor){
  if(floor===st.floor){afterArrive();return}
  st.busy=true;const dir=floor>st.floor?'up':'down';
  $('#cabin-light').classList.add('moving');updateLED(st.floor,dir);
  say(dir==='up'?'上升':'下降',dir==='up'?'Going up':'Going down');
  placeCabin(floor);
  const dist=Math.abs(floor-st.floor),duration=500+dist*150;
  let f=st.floor;const step=dir==='up'?1:-1;
  const iv=setInterval(()=>{f+=step;updateLED(f,dir);playTone(350+f*50,.05)},duration/dist);
  setTimeout(()=>{
    clearInterval(iv);st.floor=floor;st.busy=false;
    $('#cabin-light').classList.remove('moving');
    fbtns.forEach((b,i)=>{if(b)b.classList.remove('lit')});
    updateLED(floor,'');ding();afterArrive();
  },duration);
}

function afterArrive(){
  const hasW=st.tasks.some(t=>!t.done&&!t.pickedUp&&t.pickup===st.floor);
  const hasD=st.passengers.some(p=>p.drop===st.floor);
  if(hasW||hasD){setTimeout(()=>say('到了，按开门','Arrived! Press OPEN'),250)}
  else{
    const nd=st.passengers.length>0?st.passengers[0]:null;
    const np=st.tasks.find(t=>!t.done&&!t.pickedUp);
    if(nd)setTimeout(()=>say(`送到${nd.drop}楼`,`Go to floor ${NUM_EN[nd.drop]}`),250);
    else if(np)setTimeout(()=>say(`去${np.pickup}楼接${np.ch.name}`,`Go to floor ${NUM_EN[np.pickup]}`),250);
  }
}

/* === Open door === */
function onOpen(){
  ensureAC();if(st.busy)return;
  if(st.doorOpen){say('门已经开着啦','Door is already open');return}
  st.busy=true;st.doorOpen=true;$('#cabin').classList.add('open');boop();say('开门','Open');
  setTimeout(()=>{
    let any=false;
    const exiting=st.passengers.filter(p=>p.drop===st.floor);
    if(exiting.length>0){
      any=true;
      exiting.forEach(p=>{
        st.passengers=st.passengers.filter(pp=>pp.id!==p.id);
        const task=st.tasks.find(t=>t.id===p.id);if(task)task.done=true;
        st.score++;
      });
      $('#score-num').textContent=st.score;
      const box=$('#score-box');box.classList.remove('pop');void box.offsetHeight;box.classList.add('pop');
      updateCabinDisplay();
      if(st.score>=WIN_SCORE){st.busy=false;renderTaskBar();showVictory();return}
      showPraise();
    }
    const boarding=st.tasks.filter(t=>!t.done&&!t.pickedUp&&t.pickup===st.floor);
    if(boarding.length>0){
      any=true;
      setTimeout(()=>{
        boarding.forEach(t=>{
          t.pickedUp=true;st.passengers.push({id:t.id,ch:t.ch,drop:t.drop});
          const el=document.querySelector(`.waiting-char[data-task-id="${t.id}"]`);
          if(el){el.style.transition='all .4s';el.style.opacity='0';el.style.transform='scale(.3)';setTimeout(()=>el.remove(),400)}
        });
        updateCabinDisplay();cuteMelody();renderTaskBar();
        if(st.passengers.length>0){const p=st.passengers[0];say(`送${p.ch.name}去${p.drop}楼`,`Take ${p.ch.nameEn} to floor ${NUM_EN[p.drop]}`);}
        st.busy=false;
        setTimeout(()=>{
          if(st.tasks.filter(t=>!t.done).length<MAX_QUEUE){
            const nt=spawnTask();
            if(nt){pickupChime();say(`${nt.ch.name}在${nt.pickup}楼等电梯`,`${nt.ch.nameEn} on floor ${NUM_EN[nt.pickup]}`);}
          }
        },2000);
      },exiting.length>0?800:0);
    }else st.busy=false;
    if(!any){
      st.busy=false;
      const nd=st.passengers.length>0?st.passengers[0]:null;
      const np=st.tasks.find(t=>!t.done&&!t.pickedUp);
      if(nd)say(`这里没人下车，去${nd.drop}楼`,`No one gets off here, go to floor ${NUM_EN[nd.drop]}`);
      else if(np)say(`这里没人，去${np.pickup}楼接${np.ch.name}`,`No one here, go to floor ${NUM_EN[np.pickup]}`);
    }
    renderTaskBar();
  },650);
}

function updateCabinDisplay(){$('#cabin-inside').innerHTML=st.passengers.map(p=>renderChar(p.ch,12)).join('')}

function onClose(){
  ensureAC();if(st.busy)return;
  if(!st.doorOpen){say('门已经关着','Door is already closed');return}
  st.doorOpen=false;$('#cabin').classList.remove('open');boop();say('关门','Close');
}

function showPraise(){const[zh,en]=PRAISE[Math.floor(Math.random()*PRAISE.length)];say(zh,en);cuteMelody();miniConfetti()}

function miniConfetti(){
  const colors=['#ff6b9d','#ffd166','#06d6a0','#c850c0','#118ab2','#ff6b35'];
  for(let i=0;i<20;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.background=colors[i%colors.length];c.style.width=Math.random()*8+6+'px';
    c.style.height=Math.random()*10+8+'px';c.style.left=Math.random()*100+'%';
    c.style.top='-10px';c.style.position='absolute';c.style.zIndex='100';
    const dx=(Math.random()-.5)*160;
    c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,60vh) rotate(${500+Math.random()*400}deg)`,opacity:0}],{duration:1400+Math.random()*600,easing:'ease-out'});
    $('#game').appendChild(c);setTimeout(()=>c.remove(),2100);
  }
}

/* === Victory with fireworks & star collection === */
function showVictory(){
  if(spawnTimer)clearInterval(spawnTimer);
  victoryFanfare();
  say('恭喜你，全部送达！你是最棒的小司机！','Congratulations! You are the best elevator driver!');
  totalStars+=st.score;localStorage.setItem('elevator_total_stars',String(totalStars));
  const titles=['太棒啦!','你是冠军!','超级厉害!','完美通关!'];
  const subs=['You are AMAZING!','Champion!','SUPER STAR!','PERFECT!'];
  const idx=Math.floor(Math.random()*titles.length);
  $('#v-title').textContent=titles[idx];$('#v-sub').textContent=subs[idx];

  const sc=$('#star-collect');sc.innerHTML='';
  for(let i=0;i<st.score;i++){
    const s=document.createElement('span');s.className='collected-star';s.textContent='⭐';
    sc.appendChild(s);
    setTimeout(()=>{s.classList.add('visible');starChime(i)},600+i*300);
  }
  $('#total-stars-count').textContent=totalStars;
  $('#victory').classList.add('show');
  launchFireworks();
}

function launchFireworks(){
  const g=$('#game'),w=g.clientWidth,h=g.clientHeight;
  const colors=['#ff6b9d','#ffd700','#00e5ff','#ff4081','#76ff03','#e040fb','#ffab40','#40c4ff'];

  function burst(x,y){
    const n=28+Math.floor(Math.random()*18);
    for(let i=0;i<n;i++){
      const p=document.createElement('div');p.className='fw-particle';
      const col=colors[Math.floor(Math.random()*colors.length)];
      p.style.background=col;p.style.boxShadow=`0 0 4px ${col}`;
      p.style.left=x+'px';p.style.top=y+'px';p.style.position='absolute';p.style.zIndex='602';
      const angle=(Math.PI*2*i)/n+Math.random()*.3;
      const speed=50+Math.random()*110;
      const dx=Math.cos(angle)*speed,dy=Math.sin(angle)*speed;
      const sz=2+Math.random()*4;p.style.width=sz+'px';p.style.height=sz+'px';
      p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy+50}px) scale(0)`,opacity:0}],{duration:700+Math.random()*500,easing:'cubic-bezier(.15,.8,.3,1)'});
      g.appendChild(p);setTimeout(()=>p.remove(),1300);
    }
  }

  const pts=[[w*.2,h*.18],[w*.8,h*.13],[w*.5,h*.08],[w*.3,h*.22],[w*.7,h*.17],[w*.5,h*.28],[w*.15,h*.1],[w*.85,h*.25],[w*.4,h*.15]];
  pts.forEach(([x,y],i)=>setTimeout(()=>{burst(x,y);playTone(200+Math.random()*300,.3,'sine',.06)},i*400+Math.random()*200));

  for(let wave=0;wave<4;wave++){
    setTimeout(()=>{
      for(let i=0;i<30;i++){
        const c=document.createElement('div');c.className='confetti';
        c.style.background=colors[i%colors.length];c.style.width=Math.random()*10+8+'px';
        c.style.height=Math.random()*14+8+'px';c.style.left=Math.random()*100+'%';
        c.style.top='-20px';c.style.position='absolute';c.style.zIndex='602';
        const dx=(Math.random()-.5)*300,dur=2000+Math.random()*1500;
        c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,110vh) rotate(${800+Math.random()*600}deg)`,opacity:.7}],{duration:dur,easing:'cubic-bezier(.15,.8,.3,1)'});
        g.appendChild(c);setTimeout(()=>c.remove(),dur+50);
      }
    },wave*700);
  }
}

$('#v-again').addEventListener('click',()=>{
  $('#victory').classList.remove('show');st.score=0;$('#score-num').textContent='0';
  ensureAC();say('再来一次',"Let's go again");
  setTimeout(()=>{startGame();startSpawnTimer()},800);
});

function repeatHint(){
  if(st.passengers.length>0)say(`送到${st.passengers[0].drop}楼`,`Go to floor ${NUM_EN[st.passengers[0].drop]}`);
  else{const t=st.tasks.find(t=>!t.done&&!t.pickedUp);if(t)say(`去${t.pickup}楼接${t.ch.name}`,`Go to floor ${NUM_EN[t.pickup]}`);}
}

$('#go-btn').addEventListener('click',()=>{
  $('#intro').classList.add('hide');ensureAC();
  say('欢迎来到皇家电梯，十层大冒险','Welcome to Royal Elevator, ten floors adventure');
  cuteMelody();placeCabin(1,false);updateLED(1,'');
  setTimeout(()=>{startGame();startSpawnTimer()},2200);
});

placeCabin(1,false);
window.addEventListener('resize',()=>placeCabin(st.floor,false));
</script>
