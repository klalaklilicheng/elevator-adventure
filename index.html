<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>皇家电梯 · Royal Elevator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif}
body{display:flex;align-items:center;justify-content:center;touch-action:manipulation;background:#1a0a2e}

#game{position:relative;width:100vw;height:100vh;max-width:520px;background:linear-gradient(180deg,#ffecd2 0%,#fcb69f 50%,#ffecd2 100%);overflow:hidden}

/* === 积分 左上 === */
#score-box{position:absolute;top:env(safe-area-inset-top,14px);left:14px;z-index:60;background:rgba(255,255,255,.92);border-radius:20px;padding:6px 14px;box-shadow:0 4px 16px rgba(0,0,0,.1);display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800;color:#e91e63}
#score-box .star{font-size:20px}

/* === 任务栏（队列） === */
#task-bar{position:absolute;top:env(safe-area-inset-top,14px);left:50%;transform:translateX(-50%);z-index:55;display:flex;gap:6px;align-items:center;max-width:72%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#task-bar::-webkit-scrollbar{display:none}
.task-card{background:#fff;border-radius:14px;padding:5px 10px;box-shadow:0 3px 12px rgba(0,0,0,.1);display:flex;align-items:center;gap:5px;min-width:max-content;transition:all .3s;border:2px solid transparent}
.task-card.active{border-color:#c850c0;background:linear-gradient(135deg,#fff0f6,#fff);box-shadow:0 3px 16px rgba(200,80,192,.25)}
.task-card.done{opacity:.4;transform:scale(.85)}
.tc-char{font-size:22px}
.tc-info{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tc-from,.tc-to{font-size:11px;font-weight:800;color:#333}
.tc-arrow{font-size:8px;color:#aaa}
.tc-to{color:#c850c0}

/* === 建筑 === */
#building{position:absolute;top:55px;bottom:180px;left:12px;right:12px;display:flex;border-radius:16px;overflow:visible}

/* 楼层 */
#floors-side{flex:1;display:flex;flex-direction:column-reverse;position:relative}
.floor-row{flex:1;border-bottom:1.5px solid rgba(139,69,19,.12);display:flex;align-items:center;padding:0 6px;position:relative}
.floor-row:last-child{border-bottom:2px solid rgba(139,69,19,.3)}
.fl-num{font-size:11px;font-weight:800;color:#8b4513;opacity:.6;width:20px;text-align:center}
.fl-waiting{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:2px;padding-right:4px;flex-wrap:nowrap;overflow:hidden}
.waiting-char{font-size:clamp(18px,4vw,26px);opacity:0;transform:scale(.5);transition:all .4s ease-out;position:relative}
.waiting-char.show{opacity:1;transform:scale(1);animation:charBounce 2s ease-in-out infinite}
@keyframes charBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.waiting-dest{position:absolute;bottom:-2px;right:-4px;font-size:8px;background:#c850c0;color:#fff;border-radius:6px;padding:0 3px;font-weight:800;line-height:1.4}

/* 电梯井道 === */
#shaft{width:clamp(70px,18vw,100px);background:linear-gradient(180deg,#4a2c2a,#2d1b18);border-radius:10px;position:relative;border:3px solid #8b4513;overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}

/* LED */
#led-display{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:#111;border:2px solid #444;border-radius:5px;padding:2px 8px;z-index:5;display:flex;align-items:center;gap:3px}
#led-floor{font-family:"Courier New",monospace;font-size:18px;font-weight:900;color:#0f0;text-shadow:0 0 10px #0f0}
#led-dir{font-size:10px;color:#0f0;text-shadow:0 0 6px #0f0}

/* 轿厢 */
#cabin{position:absolute;left:5px;right:5px;height:calc((100% - 30px) / 10);bottom:3px;background:linear-gradient(180deg,#fff8e1,#ffe0b2);border:2.5px solid #ff8f00;border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.3),inset 0 -2px 6px rgba(0,0,0,.1);transition:bottom .9s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:center;overflow:hidden}
#cabin::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ff8f00,#ffc107,#ff8f00);border-radius:6px 6px 0 0}

/* 门 */
.door{position:absolute;top:6px;bottom:3px;width:calc(50% - 5px);background:linear-gradient(180deg,#795548,#5d4037);border-radius:3px;transition:transform .6s cubic-bezier(.25,.8,.25,1);z-index:2}
.door.L{left:3px}
.door.R{right:3px}
#cabin.open .door.L{transform:translateX(-95%)}
#cabin.open .door.R{transform:translateX(95%)}

/* 门上的小窗 */
.door::after{content:'';position:absolute;top:18%;left:22%;width:56%;height:22%;background:rgba(255,255,255,.15);border-radius:3px}

/* 轿厢内乘客 */
#cabin-inside{z-index:1;font-size:clamp(14px,3vw,20px);display:flex;gap:1px;flex-wrap:wrap;justify-content:center;max-width:90%}

/* 轿厢指示灯 */
#cabin-light{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#4caf50;box-shadow:0 0 4px #4caf50;z-index:3;transition:background .3s,box-shadow .3s}
#cabin-light.moving{background:#ff9800;box-shadow:0 0 6px #ff9800;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* === 控制面板 === */
#panel{position:absolute;bottom:env(safe-area-inset-bottom,6px);left:8px;right:8px;z-index:40;padding-bottom:4px}
#panel-bg{background:rgba(255,255,255,.95);border-radius:20px;padding:10px 12px;box-shadow:0 -4px 24px rgba(0,0,0,.1)}

#floor-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px}
.fbtn{aspect-ratio:1;border-radius:50%;border:2.5px solid #e0e0e0;background:#fff;font-size:clamp(14px,3.8vw,20px);font-weight:900;color:#333;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.fbtn:active{transform:scale(.9)}
.fbtn.lit{background:linear-gradient(135deg,#ff6b9d,#c850c0);color:#fff;border-color:#c850c0;box-shadow:0 0 16px rgba(200,80,192,.4)}
.fbtn.wrong{animation:shake .35s;border-color:#f44336;background:#fee}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fbtn small{font-size:7px;color:#999;font-weight:600;margin-top:0}
.fbtn.lit small{color:rgba(255,255,255,.8)}
.fbtn.has-passenger{border-color:#ff6b9d;box-shadow:0 0 8px rgba(255,107,157,.3)}

#door-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dbtn{padding:10px;border:none;border-radius:14px;font-size:16px;font-weight:800;color:#fff;cursor:pointer;transition:transform .1s;display:flex;flex-direction:column;align-items:center;gap:1px}
.dbtn:active{transform:scale(.94)}
.dbtn.open{background:linear-gradient(135deg,#4caf50,#2e7d32)}
.dbtn.close{background:linear-gradient(135deg,#f44336,#c62828)}
.dbtn small{font-size:10px;opacity:.85}

/* === 开始页 === */
#intro{position:absolute;inset:0;z-index:500;background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px;transition:opacity .6s}
#intro.hide{opacity:0;pointer-events:none}
#intro .chars{font-size:72px;margin-bottom:16px;animation:float 2.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#intro h1{font-size:clamp(30px,8vw,44px);margin-bottom:6px;text-shadow:0 3px 10px rgba(0,0,0,.2)}
#intro h2{font-size:clamp(16px,4vw,20px);opacity:.9;font-weight:400;margin-bottom:36px}
#go-btn{background:#fff;color:#764ba2;border:none;padding:18px 52px;border-radius:999px;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.2)}
#go-btn:active{transform:scale(.95)}

/* === 胜利页 === */
#victory{position:absolute;inset:0;z-index:600;display:none;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(135deg,#ff6a88,#ff99ac,#fcb69f,#ffecd2);text-align:center;padding:24px}
#victory.show{display:flex;animation:victoryIn .8s ease-out}
@keyframes victoryIn{0%{opacity:0;transform:scale(.3) rotate(-10deg)}50%{transform:scale(1.1) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
#victory .crown{font-size:100px;animation:crownBounce 1s ease-in-out infinite}
@keyframes crownBounce{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-15px) rotate(-5deg)}75%{transform:translateY(-15px) rotate(5deg)}}
#victory .v-title{font-size:clamp(36px,10vw,56px);font-weight:900;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.2);margin:16px 0 8px}
#victory .v-sub{font-size:clamp(18px,5vw,26px);color:rgba(255,255,255,.9);margin-bottom:24px}
#victory .v-stars{font-size:36px;margin-bottom:24px}
#victory .v-again{background:#fff;color:#e91e63;border:none;padding:16px 44px;border-radius:999px;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#victory .v-again:active{transform:scale(.95)}
.confetti{position:absolute;pointer-events:none;z-index:601;border-radius:3px}

/* === 音效按钮 === */
#sound-toggle{position:absolute;top:env(safe-area-inset-top,14px);right:14px;z-index:60;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.1)}
</style>
</head>
<body>
<div id="game">

<!-- 开始页 -->
<div id="intro">
  <div class="chars">👸🤴🛗</div>
  <h1>皇家电梯</h1>
  <h2>Royal Elevator · 10层</h2>
  <button id="go-btn">开始 · Start</button>
</div>

<!-- 积分 -->
<div id="score-box"><span class="star">⭐</span><span id="score-num">0</span></div>
<button id="sound-toggle">🔊</button>

<!-- 任务栏 -->
<div id="task-bar"></div>

<!-- 建筑 -->
<div id="building">
  <div id="floors-side"></div>
  <div id="shaft">
    <div id="led-display"><span id="led-dir">■</span><span id="led-floor">1</span></div>
    <div id="cabin">
      <div id="cabin-light"></div>
      <div class="door L"></div>
      <div class="door R"></div>
      <div id="cabin-inside"></div>
    </div>
  </div>
</div>

<!-- 控制面板 -->
<div id="panel"><div id="panel-bg">
  <div id="floor-grid"></div>
  <div id="door-row">
    <button class="dbtn open" id="btn-open">开门<small>OPEN</small></button>
    <button class="dbtn close" id="btn-close">关门<small>CLOSE</small></button>
  </div>
</div></div>

<!-- 胜利页 -->
<div id="victory">
  <div class="crown">👑</div>
  <div class="v-title" id="v-title">太棒啦!</div>
  <div class="v-sub" id="v-sub">You are AMAZING!</div>
  <div class="v-stars" id="v-stars"></div>
  <button class="v-again" id="v-again">再玩一次 · Again</button>
</div>

</div>

<script>
'use strict';

const FLOORS = 10;
const NUM_EN = ['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN'];
const CHARS = ['👸','🤴','👸','🤴','👸','🤴','👸','🤴'];
const WIN_SCORE = 8;
const MAX_QUEUE = 3;     // 同时最多排队乘客数

const PRAISE = [
  ['太棒了!','Great job!'],
  ['你真厉害!','Amazing!'],
  ['完美!','Perfect!'],
  ['好聪明!','So smart!'],
  ['超级棒!','Wonderful!'],
];

const $ = s => document.querySelector(s);

/* === 状态 === */
const st = {
  floor: 1,
  doorOpen: false,
  busy: false,
  // 多乘客队列
  tasks: [],        // [{id, char, pickup, drop, pickedUp, done}]
  passengers: [],   // 轿厢内乘客 [{id, char, drop}]
  score: 0,
  taskId: 0,
};

/* === 音频 === */
let ac = null;
function ensureAC(){
  if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(ac&&ac.state==='suspended')ac.resume();
}
function playTone(freq,dur=.12,type='sine',vol=.12){
  if(!ac)return;
  try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.stop(ac.currentTime+dur)}catch(e){}
}
function ding(){playTone(880,.12);setTimeout(()=>playTone(1100,.1),100);setTimeout(()=>playTone(1320,.15),200)}
function boop(){playTone(520,.06)}
function buzz(){playTone(160,.2,'sawtooth',.08)}
function cuteMelody(){
  const notes=[523,587,659,784,880];
  notes.forEach((n,i)=>setTimeout(()=>playTone(n,.12,'sine',.1),i*120));
}
function victoryFanfare(){
  const notes=[523,523,523,659,784,784,659,784,1047];
  const durs=[.1,.1,.2,.15,.1,.1,.15,.15,.3];
  let t=0;
  notes.forEach((n,i)=>{setTimeout(()=>playTone(n,durs[i],'sine',.13),t*1000);t+=durs[i]+.05});
}
function pickupChime(){playTone(659,.1);setTimeout(()=>playTone(784,.1),100);setTimeout(()=>playTone(1047,.15),200)}

/* === 语音 === */
const synth=window.speechSynthesis;
let zhV=null,enV=null;
function pickV(){if(!synth)return;const v=synth.getVoices();zhV=v.find(x=>/zh|cmn/i.test(x.lang))||null;enV=v.find(x=>/en[-_]?(US|GB)/i.test(x.lang))||v.find(x=>x.lang&&x.lang.startsWith('en'))||null}
if(synth){pickV();synth.onvoiceschanged=pickV}
const sq=[];let spk=false;
function enq(text,lang){sq.push({text,lang});pump()}
function pump(){if(spk||!sq.length||!synth)return;const{text,lang}=sq.shift();spk=true;try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang.startsWith('zh')?1:.8;u.pitch=1.2;if(lang.startsWith('zh')&&zhV)u.voice=zhV;if(lang.startsWith('en')&&enV)u.voice=enV;u.onend=u.onerror=()=>{spk=false;setTimeout(pump,80)};synth.speak(u)}catch(e){spk=false;setTimeout(pump,50)}}
function clearSp(){sq.length=0;if(synth)try{synth.cancel()}catch(e){}spk=false}
function say(zh,en){if(zh)enq(zh,'zh-CN');if(en)enq(en,'en-US')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearSp()});

/* === 构建楼层 === */
const floorsSide=$('#floors-side');
for(let f=1;f<=FLOORS;f++){
  const row=document.createElement('div');
  row.className='floor-row';row.dataset.floor=f;
  row.innerHTML=`<span class="fl-num">${f}F</span><div class="fl-waiting" id="fw-${f}"></div>`;
  floorsSide.appendChild(row);
}

/* === 楼层按钮 (2行 × 5列: 上排 6-10, 下排 1-5) === */
const grid=$('#floor-grid');
const fbtns=[];
// 上排 6-10
for(let f=6;f<=10;f++){
  const b=document.createElement('button');
  b.className='fbtn';b.dataset.floor=f;
  b.innerHTML=`${f}<small>${NUM_EN[f]}</small>`;
  b.addEventListener('click',()=>onFloorBtn(f,b));
  grid.appendChild(b);
  fbtns[f]=b;
}
// 下排 1-5
for(let f=1;f<=5;f++){
  const b=document.createElement('button');
  b.className='fbtn';b.dataset.floor=f;
  b.innerHTML=`${f}<small>${NUM_EN[f]}</small>`;
  b.addEventListener('click',()=>onFloorBtn(f,b));
  grid.appendChild(b);
  fbtns[f]=b;
}

$('#btn-open').addEventListener('click',onOpen);
$('#btn-close').addEventListener('click',onClose);
$('#sound-toggle').addEventListener('click',()=>{ensureAC();repeatHint()});

/* === 轿厢定位 === */
function placeCabin(floor,anim=true){
  const cabin=$('#cabin');
  const shaftH=$('#shaft').clientHeight-30;
  const floorH=shaftH/FLOORS;
  const bottom=3+(floor-1)*floorH;
  if(!anim){cabin.style.transition='none';cabin.style.bottom=bottom+'px';void cabin.offsetHeight;cabin.style.transition=''}
  else{cabin.style.bottom=bottom+'px'}
}

function updateLED(floor,dir){
  $('#led-floor').textContent=floor;
  $('#led-dir').textContent=dir==='up'?'▲':dir==='down'?'▼':'■';
}

/* === 任务栏渲染 === */
function renderTaskBar(){
  const bar=$('#task-bar');
  bar.innerHTML='';
  // 找当前活跃任务(未完成且未被接的第一个，或已被接在轿厢里的)
  const activeTask = getActiveTask();
  st.tasks.forEach(t=>{
    if(t.done) return;
    const card=document.createElement('div');
    card.className='task-card';
    if(activeTask && t.id===activeTask.id) card.classList.add('active');

    const fromFloor = t.pickedUp ? '🛗' : t.pickup;
    const toFloor = t.drop;

    card.innerHTML=`<span class="tc-char">${t.char}</span><span class="tc-info"><span class="tc-from">${fromFloor}F</span><span class="tc-arrow">▼</span><span class="tc-to">${toFloor}F</span></span>`;
    bar.appendChild(card);
  });

  // 高亮有乘客等待的楼层按钮
  for(let f=1;f<=FLOORS;f++){
    if(fbtns[f]) fbtns[f].classList.remove('has-passenger');
  }
  st.tasks.forEach(t=>{
    if(!t.pickedUp && !t.done && fbtns[t.pickup]){
      fbtns[t.pickup].classList.add('has-passenger');
    }
  });
}

function getActiveTask(){
  // 优先: 轿厢内需要送达的乘客（按目标楼层排序，找当前楼层最近的）
  // 如果没有需要送达的，就找还没接的
  if(st.passengers.length>0){
    // 找轿厢内乘客对应的task
    return st.tasks.find(t=>!t.done && t.pickedUp);
  }
  return st.tasks.find(t=>!t.done && !t.pickedUp);
}

/* === 显示等待角色 === */
function renderWaiting(){
  // 清除所有等待角色
  document.querySelectorAll('.waiting-char').forEach(el=>el.remove());

  st.tasks.forEach(t=>{
    if(t.pickedUp || t.done) return;
    const container=$(`#fw-${t.pickup}`);
    if(!container) return;
    const el=document.createElement('span');
    el.className='waiting-char';
    el.dataset.taskId=t.id;
    el.innerHTML=`${t.char}<span class="waiting-dest">${t.drop}</span>`;
    container.appendChild(el);
    setTimeout(()=>el.classList.add('show'),60);
  });
}

/* === 生成新任务 === */
function spawnTask(){
  const pendingCount = st.tasks.filter(t=>!t.done).length;
  if(pendingCount >= MAX_QUEUE) return null;

  let pickup, drop;
  const usedPickups = st.tasks.filter(t=>!t.done && !t.pickedUp).map(t=>t.pickup);
  let attempts = 0;
  do{
    pickup = 1 + Math.floor(Math.random()*FLOORS);
    drop = 1 + Math.floor(Math.random()*FLOORS);
    attempts++;
  }while((pickup===drop || usedPickups.includes(pickup)) && attempts < 50);

  if(pickup===drop) drop = pickup===FLOORS ? pickup-1 : pickup+1;

  const char = CHARS[Math.floor(Math.random()*CHARS.length)];
  const task = {id: ++st.taskId, char, pickup, drop, pickedUp: false, done: false};
  st.tasks.push(task);

  renderWaiting();
  renderTaskBar();

  return task;
}

/* === 初始出题 === */
function startGame(){
  st.tasks = [];
  st.passengers = [];
  st.taskId = 0;
  st.busy = false;
  st.doorOpen = false;
  $('#cabin').classList.remove('open');
  $('#cabin-inside').textContent='';
  fbtns.forEach((b,i)=>{if(b)b.classList.remove('lit','wrong','has-passenger')});
  document.querySelectorAll('.waiting-char').forEach(el=>el.remove());

  // 生成2个初始任务
  const t1 = spawnTask();
  setTimeout(()=>{
    spawnTask();
    renderTaskBar();
    // 语音提示
    if(t1){
      const who = t1.char==='👸'?'公主':'王子';
      const whoEn = t1.char==='👸'?'princess':'prince';
      say(`${who}在${t1.pickup}楼等电梯`,`The ${whoEn} is on floor ${NUM_EN[t1.pickup]}`);
    }
  },800);
}

/* === 定时添加新乘客 === */
let spawnTimer = null;
function startSpawnTimer(){
  if(spawnTimer) clearInterval(spawnTimer);
  spawnTimer = setInterval(()=>{
    if(st.busy) return;
    const pending = st.tasks.filter(t=>!t.done).length;
    if(pending < MAX_QUEUE){
      const t = spawnTask();
      if(t){
        pickupChime();
        const who = t.char==='👸'?'公主':'王子';
        say(`${who}在${t.pickup}楼等电梯`,`New passenger on floor ${NUM_EN[t.pickup]}`);
      }
    }
  },8000); // 每8秒检查是否需要添加新乘客
}

/* === 楼层按钮点击 === */
function onFloorBtn(floor,btn){
  ensureAC();
  if(st.busy)return;
  boop();

  // 说出数字
  say(String(floor),`Floor ${NUM_EN[floor]}`);

  if(st.doorOpen){
    btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),350);
    say('先关门哦','Close the door first');return;
  }

  // 检查这个楼层是否有意义（有乘客等或有人要下）
  const hasWaiting = st.tasks.some(t=>!t.done && !t.pickedUp && t.pickup===floor);
  const hasDropoff = st.passengers.some(p=>p.drop===floor);

  if(!hasWaiting && !hasDropoff && st.passengers.length===0){
    // 没人等也没人要下，提示去接人
    const nextTask = st.tasks.find(t=>!t.done && !t.pickedUp);
    if(nextTask && floor !== nextTask.pickup){
      btn.classList.add('wrong');buzz();
      setTimeout(()=>btn.classList.remove('wrong'),350);
      const who = nextTask.char==='👸'?'公主':'王子';
      say(`去${nextTask.pickup}楼接${who}`,`Go to floor ${NUM_EN[nextTask.pickup]}`);
      return;
    }
  }

  fbtns.forEach((b,i)=>{if(b)b.classList.remove('lit')});
  btn.classList.add('lit');
  moveTo(floor);
}

/* === 移动 === */
function moveTo(floor){
  if(floor===st.floor){afterArrive();return}
  st.busy=true;
  const dir=floor>st.floor?'up':'down';
  const light=$('#cabin-light');
  light.classList.add('moving');
  updateLED(st.floor,dir);
  say(dir==='up'?'上升':'下降',dir==='up'?'Going up':'Going down');

  placeCabin(floor);

  const dist=Math.abs(floor-st.floor);
  const duration=500+dist*150;
  let f=st.floor;const step=dir==='up'?1:-1;
  const iv=setInterval(()=>{f+=step;updateLED(f,dir);playTone(350+f*50,.05)},duration/dist);

  setTimeout(()=>{
    clearInterval(iv);
    st.floor=floor;st.busy=false;
    light.classList.remove('moving');
    fbtns.forEach((b,i)=>{if(b)b.classList.remove('lit')});
    updateLED(floor,'');
    ding();
    afterArrive();
  },duration);
}

function afterArrive(){
  // 检查当前楼层是否有人等或有人要下
  const hasWaiting = st.tasks.some(t=>!t.done && !t.pickedUp && t.pickup===st.floor);
  const hasDropoff = st.passengers.some(p=>p.drop===st.floor);

  if(hasWaiting || hasDropoff){
    setTimeout(()=>say('到了，按开门','Arrived! Press OPEN'),250);
  } else {
    // 引导去有任务的楼层
    const nextPickup = st.tasks.find(t=>!t.done && !t.pickedUp);
    const nextDrop = st.passengers.length>0 ? st.passengers[0] : null;
    if(nextDrop){
      setTimeout(()=>say(`送到${nextDrop.drop}楼`,`Go to floor ${NUM_EN[nextDrop.drop]}`),250);
    } else if(nextPickup){
      const who = nextPickup.char==='👸'?'公主':'王子';
      setTimeout(()=>say(`去${nextPickup.pickup}楼接${who}`,`Go to floor ${NUM_EN[nextPickup.pickup]}`),250);
    }
  }
}

/* === 开门 === */
function onOpen(){
  ensureAC();
  if(st.busy)return;
  if(st.doorOpen){say('门已经开着啦','Door is already open');return}

  st.busy=true;st.doorOpen=true;
  $('#cabin').classList.add('open');
  boop();say('开门','Open');

  // 处理当前楼层的所有事件
  setTimeout(()=>{
    let anyAction = false;

    // 1. 先让到站的乘客下车
    const exiting = st.passengers.filter(p=>p.drop===st.floor);
    if(exiting.length>0){
      anyAction = true;
      exiting.forEach(p=>{
        // 从轿厢移除
        st.passengers = st.passengers.filter(pp=>pp.id!==p.id);
        // 标记任务完成
        const task = st.tasks.find(t=>t.id===p.id);
        if(task) task.done = true;
        st.score++;
      });
      $('#score-num').textContent = st.score;
      updateCabinDisplay();

      if(st.score >= WIN_SCORE){
        st.busy=false;
        renderTaskBar();
        showVictory();
        return;
      }

      showPraise();
    }

    // 2. 再让等待的乘客上车
    const boarding = st.tasks.filter(t=>!t.done && !t.pickedUp && t.pickup===st.floor);
    if(boarding.length>0){
      anyAction = true;
      setTimeout(()=>{
        boarding.forEach(t=>{
          t.pickedUp = true;
          st.passengers.push({id:t.id, char:t.char, drop:t.drop});
          // 移除等待角色动画
          const el = document.querySelector(`.waiting-char[data-task-id="${t.id}"]`);
          if(el){el.style.transition='all .4s';el.style.opacity='0';el.style.transform='scale(.3)';setTimeout(()=>el.remove(),400)}
        });

        updateCabinDisplay();
        cuteMelody();
        renderTaskBar();

        // 语音提示送到哪里
        if(st.passengers.length>0){
          const p = st.passengers[0];
          const who = p.char==='👸'?'公主':'王子';
          const whoEn = p.char==='👸'?'princess':'prince';
          say(`送${who}去${p.drop}楼`,`Take the ${whoEn} to floor ${NUM_EN[p.drop]}`);
        }

        st.busy=false;

        // 尝试生成新任务
        setTimeout(()=>{
          if(st.tasks.filter(t=>!t.done).length < MAX_QUEUE){
            const nt = spawnTask();
            if(nt){
              pickupChime();
              const nw = nt.char==='👸'?'公主':'王子';
              say(`${nw}在${nt.pickup}楼等电梯`,`New passenger on floor ${NUM_EN[nt.pickup]}`);
            }
          }
        },2000);
      }, exiting.length>0 ? 800 : 0);
    } else {
      st.busy=false;
    }

    if(!anyAction){
      st.busy=false;
      // 没有任何事情发生，提示一下
      const nextPickup = st.tasks.find(t=>!t.done && !t.pickedUp);
      const nextDrop = st.passengers.length>0 ? st.passengers[0] : null;
      if(nextDrop){
        say(`这里没人下车，去${nextDrop.drop}楼`,`No one gets off here, go to floor ${NUM_EN[nextDrop.drop]}`);
      } else if(nextPickup){
        const who = nextPickup.char==='👸'?'公主':'王子';
        say(`这里没人，去${nextPickup.pickup}楼接${who}`,`No one here, go to floor ${NUM_EN[nextPickup.pickup]}`);
      }
    }

    renderTaskBar();
  },650);
}

/* === 更新轿厢内显示 === */
function updateCabinDisplay(){
  const inside = $('#cabin-inside');
  inside.innerHTML = st.passengers.map(p=>p.char).join('');
}

/* === 关门 === */
function onClose(){
  ensureAC();
  if(st.busy)return;
  if(!st.doorOpen){say('门已经关着','Door is already closed');return}
  st.doorOpen=false;
  $('#cabin').classList.remove('open');
  boop();say('关门','Close');
}

/* === 表扬 === */
function showPraise(){
  const [zh,en]=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  say(zh,en);
  cuteMelody();
  miniConfetti();
}

function miniConfetti(){
  const colors=['#ff6b9d','#ffd166','#06d6a0','#c850c0','#118ab2','#ff6b35'];
  for(let i=0;i<20;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.background=colors[i%colors.length];
    c.style.width=Math.random()*8+6+'px';
    c.style.height=Math.random()*10+8+'px';
    c.style.left=Math.random()*100+'%';c.style.top='-10px';
    c.style.position='absolute';c.style.zIndex='100';
    const dx=(Math.random()-.5)*160;
    c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,60vh) rotate(${500+Math.random()*400}deg)`,opacity:0}],{duration:1400+Math.random()*600,easing:'ease-out'});
    $('#game').appendChild(c);
    setTimeout(()=>c.remove(),2100);
  }
}

/* === 胜利页 === */
function showVictory(){
  if(spawnTimer) clearInterval(spawnTimer);
  victoryFanfare();
  say('恭喜你，全部送达！你是最棒的小司机！','Congratulations! You are the best elevator driver!');

  const stars='⭐'.repeat(st.score);
  $('#v-stars').textContent=stars;

  const titles=['太棒啦!','你是冠军!','超级厉害!','完美通关!'];
  const subs=['You are AMAZING!','Champion!','SUPER STAR!','PERFECT!'];
  const idx=Math.floor(Math.random()*titles.length);
  $('#v-title').textContent=titles[idx];
  $('#v-sub').textContent=subs[idx];

  $('#victory').classList.add('show');
  massConfetti();
}

function massConfetti(){
  const colors=['#ff6b9d','#ffd166','#06d6a0','#c850c0','#118ab2','#ff6b35','#a855f7','#ec4899'];
  for(let wave=0;wave<3;wave++){
    setTimeout(()=>{
      for(let i=0;i<40;i++){
        const c=document.createElement('div');c.className='confetti';
        c.style.background=colors[i%colors.length];
        c.style.width=Math.random()*10+8+'px';
        c.style.height=Math.random()*14+8+'px';
        c.style.left=Math.random()*100+'%';c.style.top='-20px';
        c.style.position='absolute';c.style.zIndex='602';
        const dx=(Math.random()-.5)*300;
        const dur=2000+Math.random()*1500;
        c.animate([
          {transform:'translate(0,0) rotate(0)',opacity:1},
          {transform:`translate(${dx}px,110vh) rotate(${800+Math.random()*600}deg)`,opacity:.7}
        ],{duration:dur,easing:'cubic-bezier(.15,.8,.3,1)'});
        $('#game').appendChild(c);
        setTimeout(()=>c.remove(),dur+50);
      }
    },wave*600);
  }
}

$('#v-again').addEventListener('click',()=>{
  $('#victory').classList.remove('show');
  st.score=0;
  $('#score-num').textContent='0';
  ensureAC();
  say('再来一次','Let\'s go again');
  setTimeout(()=>{startGame();startSpawnTimer()},800);
});

/* === 提示 === */
function repeatHint(){
  if(st.passengers.length>0){
    const p = st.passengers[0];
    say(`送到${p.drop}楼`,`Go to floor ${NUM_EN[p.drop]}`);
  } else {
    const nextTask = st.tasks.find(t=>!t.done && !t.pickedUp);
    if(nextTask){
      const who = nextTask.char==='👸'?'公主':'王子';
      say(`去${nextTask.pickup}楼接${who}`,`Go to floor ${NUM_EN[nextTask.pickup]}`);
    }
  }
}

/* === 启动 === */
$('#go-btn').addEventListener('click',()=>{
  $('#intro').classList.add('hide');
  ensureAC();
  say('欢迎来到皇家电梯，十层大冒险','Welcome to Royal Elevator, ten floors adventure');
  cuteMelody();
  placeCabin(1,false);
  updateLED(1,'');
  setTimeout(()=>{startGame();startSpawnTimer()},2200);
});

// 初始化
placeCabin(1,false);

// resize 时重新定位轿厢
window.addEventListener('resize',()=>{placeCabin(st.floor,false)});
</script>
